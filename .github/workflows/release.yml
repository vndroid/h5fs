name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  check-tag:
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
      commit: ${{ steps.check.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tag name and main ancestry
        id: check
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Ignoring tag with an invalid version: $GITHUB_REF_NAME"
            exit 0
          fi

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "Ignoring tag outside main: $GITHUB_REF_NAME"
            exit 0
          fi

          echo 'eligible=true' >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release:
    needs: check-tag
    if: needs.check-tag.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check-tag.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build release archive
        env:
          H5FS_VERSION: ${{ github.ref_name }}
        run: |
          export H5FS_VERSION="${H5FS_VERSION#v}"
          npm ci
          npm run build
          test -f "build-node/h5fs-${H5FS_VERSION}.zip"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          archive="build-node/h5fs-${TAG#v}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$archive" --clobber
          else
            gh release create "$TAG" "$archive" --verify-tag --title "$TAG" --generate-notes
          fi
